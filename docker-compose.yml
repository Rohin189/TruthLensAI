version: "3.9"

services:
  backend:
    build: .
    container_name: truthlens-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/code/data
      - ./models:/code/models

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: truthlens-frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
